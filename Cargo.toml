[package]
name         = "meta-signal-criome"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-criome"
description  = "Meta signal contract for privileged criome daemon configuration."
publish      = false
links        = "meta-signal-criome"
build        = "build.rs"

[lib]
name = "meta_signal_criome"
path = "src/lib.rs"

[[test]]
name = "canonical_examples"
path = "tests/canonical_examples.rs"
required-features = ["nota-text"]

[features]
default = []
nota-text = ["dep:nota", "signal-criome/nota-text", "signal-frame/nota-text"]

[dependencies]
nota         = { package = "nota", git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "criome-auth-integration" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main", default-features = false }
thiserror    = "2"

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[dev-dependencies]
nota         = { package = "nota", git = "https://github.com/LiGoldragon/nota-next.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
